name: Deploy site to GitHub Pages

# Publica a pasta site/ (página de download do Mulla Cord) no GitHub Pages.
#
# `configure-pages` com `enablement: true` LIGA o Pages sozinho na 1ª execução
# (usa o GITHUB_TOKEN + permissão `pages: write`). Se falhar com
# "Resource not accessible", ligue à mão uma vez em:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# e rode este workflow de novo (Actions → Deploy site to GitHub Pages → Run).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
