name: build installers

# Gera os instaladores de Windows e macOS e publica a Release.
#  - manual (Actions -> "build installers" -> Run workflow): builda o main,
#    (re)cria a tag v<versao de desktop/package.json> e publica a Release.
#  - push de tag v* : mesma coisa, a partir da tag.
#
# O instalador-web do Windows baixa o .nsis.7z da Release durante a instalacao,
# entao a Release PRECISA conter o .7z. E dai que o site (releases/latest) puxa.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-14
            script: dist:mac
    runs-on: ${{ matrix.os }}
    # o build de macOS ainda esta sendo estabilizado — nao deixa ele
    # bloquear a Release do Windows.
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instala DENTRO da venv (server/.venv) — o scripts/build-server.js usa
      # essa venv pro PyInstaller. `python -m venv` sozinho nao ativa nada.
      - name: Build deps do servidor (PyInstaller)
        working-directory: server
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements.txt -r requirements-build.txt
          "$PY" -c "import PyInstaller, uvicorn, fastapi; print('venv OK')"

      - name: Deps do desktop
        working-directory: desktop
        run: npm ci

      # Cert de assinatura do Windows: se os secrets existirem, grava o .pfx
      # antes do build (o make-cert.ps1 detecta e nao regenera). Sem secret, o
      # proprio `npm run dist` gera um cert efemero — e se ate isso falhar no
      # runner, o build segue sem assinar (make-cert.ps1 sai 0, sign.js pula).
      - name: Cert do Windows (secrets, opcional)
        if: runner.os == 'Windows' && env.WIN_CSC_PFX_B64 != ''
        working-directory: desktop
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("build/MullaCord-CodeSign.pfx", [Convert]::FromBase64String($env:WIN_CSC_PFX_B64))
          Set-Content build/.cert-pass $env:WIN_CSC_PASSWORD -NoNewline -Encoding ascii
          Write-Host "cert do projeto (secrets)"
        env:
          WIN_CSC_PFX_B64: ${{ secrets.WIN_CSC_PFX_B64 }}
          WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}

      - name: Build (${{ matrix.script }})
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ad-hoc no macOS ate haver Developer ID
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Só os artefatos finais — nada de dist-installer/win-unpacked/,
      # dist-installer/mac*/ (o app cru, elevate.exe, base_library.zip, etc.).
      - name: Coleta os instaladores
        shell: bash
        run: |
          mkdir -p out
          cp desktop/dist-installer/*.exe                 out/ 2>/dev/null || true
          cp desktop/dist-installer/*.dmg                 out/ 2>/dev/null || true
          cp desktop/dist-installer/*.zip                 out/ 2>/dev/null || true
          cp desktop/dist-installer/*.yml                 out/ 2>/dev/null || true
          cp desktop/dist-installer/nsis-web/*.exe        out/ 2>/dev/null || true
          cp desktop/dist-installer/nsis-web/*.7z         out/ 2>/dev/null || true
          cp desktop/dist-installer/nsis-web/*.yml        out/ 2>/dev/null || true
          cp desktop/build/MullaCord-PublicCert.cer       out/ 2>/dev/null || true
          rm -f out/__uninstaller*.exe
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/**
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versao
        id: ver
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # Num run manual: (re)aponta a tag pra este commit. Push com GITHUB_TOKEN
      # nao dispara o gatilho `on: push: tags`, entao nao ha loop.
      - name: (Re)cria a tag v${{ steps.ver.outputs.version }}
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f "v${{ steps.ver.outputs.version }}" "${{ github.sha }}"
          git push -f origin "v${{ steps.ver.outputs.version }}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Junta e lista os artefatos
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -f {} release/ \;
          ls -la release/

      # A release pode ja existir (re-run) com assets antigos/errados — zera antes.
      - name: Limpa assets antigos da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets -q '.assets[].name' | while read -r a; do
              [ -n "$a" ] && gh release delete-asset "$tag" "$a" -y || true
            done
          fi

      - name: Publica a Release v${{ steps.ver.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            Instaladores do Mulla Cord ${{ steps.ver.outputs.version }}.

            | Arquivo | Para quê |
            |---|---|
            | **MullaCord-Web-Setup.exe** (~1 MB) | Windows 10/11 — instalador; baixa o app durante a instalação |
            | **MullaCord-portable.exe** | Windows — portátil, offline, sem instalar |
            | **MullaCord-arm64.dmg** / **MullaCord-x64.dmg** | macOS 11+ (Apple Silicon / Intel) |
            | MullaCord-PublicCert.cer | Certificado público (importe nas Autoridades Raiz p/ sumir com o aviso do SmartScreen) |

            SmartScreen (Windows) e Gatekeeper (macOS) ainda avisam — o app não tem
            assinatura paga. Veja `docs/INSTALL.md`.
          files: release/*
