name: build installers

# Gera os instaladores de Windows e macOS.
#  - manual (workflow_dispatch): sobe os artefatos, sem publicar Release
#  - push de tag v* : cria/atualiza a Release da tag e anexa TODOS os artefatos
#
# O instalador-web do Windows (MullaCord-Web-Setup-*.exe) baixa o pacote
# .nsis.7z da Release durante a instalação — por isso a Release precisa conter
# o .7z. Um build manual (sem tag) NÃO serve pra distribuir o web setup.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-14
            script: dist:mac
    runs-on: ${{ matrix.os }}
    # o build de macOS ainda está sendo estabilizado — não deixa ele
    # bloquear a Release do Windows.
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deps do servidor (PyInstaller)
        working-directory: server
        run: |
          python -m venv .venv
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Deps do desktop
        working-directory: desktop
        run: npm ci

      # Cert de assinatura do Windows: se os secrets existirem, grava o .pfx
      # antes do build (o make-cert.ps1 detecta e nao regenera). Sem secret, o
      # proprio `npm run dist` gera um cert efemero — e se ate isso falhar no
      # runner, o build segue sem assinar (make-cert.ps1 sai 0, sign.js pula).
      - name: Cert do Windows (secrets, opcional)
        if: runner.os == 'Windows' && env.WIN_CSC_PFX_B64 != ''
        working-directory: desktop
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("build/MullaCord-CodeSign.pfx", [Convert]::FromBase64String($env:WIN_CSC_PFX_B64))
          Set-Content build/.cert-pass $env:WIN_CSC_PASSWORD -NoNewline -Encoding ascii
          Write-Host "cert do projeto (secrets)"
        env:
          WIN_CSC_PFX_B64: ${{ secrets.WIN_CSC_PFX_B64 }}
          WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}

      - name: Build (${{ matrix.script }})
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ad-hoc no macOS até haver Developer ID
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            desktop/dist-installer/**/*.exe
            desktop/dist-installer/**/*.7z
            desktop/dist-installer/**/*.dmg
            desktop/dist-installer/**/*.zip
            desktop/dist-installer/**/latest*.yml
            desktop/build/MullaCord-PublicCert.cer
          if-no-files-found: warn

      - name: Anexar à Release (somente em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist-installer/**/*.exe
            desktop/dist-installer/**/*.7z
            desktop/dist-installer/**/*.dmg
            desktop/dist-installer/**/*.zip
            desktop/dist-installer/**/latest*.yml
            desktop/build/MullaCord-PublicCert.cer
          fail_on_unmatched_files: false
